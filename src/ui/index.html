<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaoCuongHung's Browser</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="browser-container">
        <!-- Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-buttons">
                <button id="back-btn" class="nav-btn" title="Back" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <button id="forward-btn" class="nav-btn" title="Forward" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
                <button id="refresh-btn" class="nav-btn" title="Refresh">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                    </svg>
                </button>
                <button id="home-btn" class="nav-btn" title="Home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </button>
            </div>

            <div class="address-bar-container">
                <input 
                    type="text" 
                    id="address-bar" 
                    class="address-bar" 
                    placeholder="Tìm kiếm trên Google hoặc nhập URL..."
                    autocomplete="off"
                />
                <button id="go-btn" class="go-btn">Go</button>
            </div>
        </div>

        <!-- Content Area with WebView -->
        <div class="content-wrapper">
            <webview 
                id="webview" 
                src="about:blank"
                style="display:inline-flex; width:100%; height:100%"
                allowpopups
            ></webview>
            <div id="welcome-screen" class="welcome-screen">
                <div class="search-container">
                    <h1 class="logo">🌐 BaoCuongHung Browser</h1>
                    <div class="search-box-wrapper">
                        <div class="search-box">
                            <input 
                                type="text" 
                                id="home-search" 
                                class="home-search-input" 
                                placeholder="Tìm kiếm trên Google hoặc nhập URL"
                                autocomplete="off"
                            />
                            <button id="home-search-btn" class="home-search-btn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"/>
                                    <path d="m21 21-4.35-4.35"/>
                                </svg>
                            </button>
                        </div>
                        <div id="history-dropdown" class="history-dropdown" style="display: none;">
                            <div class="history-header">
                                <span>Lịch sử tìm kiếm</span>
                                <button id="clear-history-btn" class="clear-history-btn">Xóa tất cả</button>
                            </div>
                            <div id="history-list" class="history-list">
                                <!-- History items will be inserted here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="status-text">Ready</span>
        </div>
    </div>

    <script src="browser.js"></script>
</body>
</html>
